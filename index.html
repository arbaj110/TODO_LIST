<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <title>Todo App</title>
</head>

<body>
    <div class="container">
        <div class="content">
            <div>
                <h1 id="main-heading"> To-do List<img class="img-icon" src="to-do-list.png" alt="todo-icon"> </h1>
            </div>
    
            <div>
                <div class="grid-container">
                    <input id="todo-input" type="text" placeholder="Enter TODO Here">
                    <input id="todo-date" type="date">
                    <button class='btn-todo' onclick="addTodo();">Add</button>
                </div>
            </div>
    
            <div>
                <div class="todo-container grid-container"></div>
    
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
